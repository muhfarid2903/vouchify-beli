# nginx untuk halaman statis, dijalankan sebagai non-root (user "nginx").
# pid & temp path di /tmp supaya tidak butuh akses tulis ke root filesystem.
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # semua temp path di /tmp (non-root friendly)
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  gzip              on;
  gzip_comp_level   5;
  gzip_min_length   256;
  gzip_proxied      any;
  gzip_vary         on;
  gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/xml;

  server {
    listen      3000;
    listen      [::]:3000;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # SPA-style fallback (juga aman untuk halaman satu file)
    location / {
      try_files $uri $uri/ /index.html;
    }

    # index.html jangan di-cache supaya update langsung terlihat
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # aset statis: cache 7 hari
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
    }
  }
}
